<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="tiktok-developers-site-verification" content="d3hGezgmUSHz5oQIm4ky5rQS2twJH1CF">
  <meta name="tiktok-developers-site-verification" content="X2CiK3DGI3ZP3rBXnSwCtAUkrvvHMoV8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autenticação Concluída - Mestre dos Arquivos</title>
  <link rel="icon" type="image/png" href="/mestre_app_icon_1024.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#0b1120; color:#f8fafc; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:24px; }
    .box { max-width:520px; width:100%; background:#1e293b; border:1px solid #334155; border-radius:14px; padding:32px; text-align:center; }
    img { width:64px; height:64px; border-radius:14px; margin-bottom:14px; object-fit:cover; }
    code { display:block; background:#0f172a; padding:12px; border-radius:8px; word-break:break-all; margin:16px 0; color:#fbbf24; }
    a { color:#fbbf24; text-decoration:none; font-weight:600; }
    .links { margin-top:16px; font-size:13px; color:#94a3b8; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/mestre_app_icon_1024.png" alt="Mestre dos Arquivos">
    <h1>Retorno de Autorização TikTok</h1>
    <p id="statusMsg">Aguardando parâmetros de autorização OAuth2...</p>
    <code id="codeBox" style="display:none;"></code>
    <p><a href="/">Voltar para Mestre dos Arquivos</a></p>
    <div class="links"><a href="/terms">Termos de Serviço</a> · <a href="/privacy">Política de Privacidade</a></div>
  </div>
  <script>
    var p = new URLSearchParams(window.location.search);
    var code = p.get('code');
    var err = p.get('error_description') || p.get('error');
    if (code) {
      document.getElementById('statusMsg').textContent = 'Autorização recebida com sucesso. Código OAuth:';
      var b = document.getElementById('codeBox'); b.style.display = 'block'; b.textContent = code;
    } else if (err) {
      document.getElementById('statusMsg').textContent = 'Erro na autorização: ' + err;
    }
  </script>
</body>
</html>
